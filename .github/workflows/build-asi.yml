name: Build & Release TextureLoader.asi

on:
  push:
    branches: [ main ]
    paths:
      - 'src/TextureLoader.cpp'
      - 'third_party/**'
      - '.github/workflows/build-asi.yml'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86-asi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install i686 MinGW-w64 cross-compiler & zip
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686 zip

      - name: Compile 32-bit TextureLoader.asi
        run: |
          mkdir -p build
          i686-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra \
            -DWIN32_LEAN_AND_MEAN -DNOMINMAX \
            -Isrc -Ithird_party \
            src/TextureLoader.cpp \
            -shared -static-libgcc -static-libstdc++ \
            -Wl,--kill-at \
            -o build/TextureLoader.asi

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p pkg/textures/hud
          cp build/TextureLoader.asi pkg/TextureLoader.asi
          cp example/ReadMe.txt pkg/ReadMe.txt
          cp example/TextureLoader.ini pkg/TextureLoader.ini
          cp example/textures/hud/siteM16.png pkg/textures/hud/siteM16.png
          (cd pkg && zip -r ../build/TextureLoader-VC.zip .)

      - name: Upload ASI & zip artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TextureLoader-VC-x86
          path: |
            build/TextureLoader.asi
            build/TextureLoader-VC.zip

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TextureLoader-VC.zip
          generate_release_notes: true
          body: |
            ### Quick Start
            1. Extract `TextureLoader-VC.zip` into your GTA Vice City PC v1.0 folder (or `scripts\` / `modloader\` subfolder).
            2. Ensure a 32-bit x86 ASI loader is installed and check `ReadMe.txt` for setup details.
